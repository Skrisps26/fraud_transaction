name: Scheduled Model Retraining

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly, Sunday 3AM UTC
  workflow_dispatch: # Manual trigger (important)

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run retraining pipeline
        id: retrain
        run: |
          python training/retrain.py
        continue-on-error: true

      - name: Commit promoted model
        if: steps.retrain.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add training/models/
          git commit -m "Auto-promote model via retraining pipeline"
          git push

      - name: Download dataset
        run: |
          mkdir -p data
          curl -L "<DATASET_URL>" -o data/transactions.csv
        # - name: Reload model in FastAPI
        #   if: steps.retrain.outcome == 'success'
        #   run: |
        #     curl -X POST "$ML_RELOAD_URL" \
        #          -H "Authorization: Bearer $ML_RELOAD_TOKEN"
        env:
          ML_RELOAD_URL: ${{ secrets.ML_RELOAD_URL }}
          ML_RELOAD_TOKEN: ${{ secrets.ML_RELOAD_TOKEN }}
